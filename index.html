<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мирая — Pop It!</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <clipPath id="heartClip" clipPathUnits="objectBoundingBox">
        <path d="M0.5,0.9 C0.1,0.62 -0.05,0.32 0.15,0.13 C0.3,-0.02 0.48,0.05 0.5,0.22 C0.52,0.05 0.7,-0.02 0.85,0.13 C1.05,0.32 0.9,0.62 0.5,0.9 Z" />
      </clipPath>
    </defs>
  </svg>

  <div class="app">
    <div class="title-bar">
      <h1 class="game-title">Мирая <span class="heart">💜</span></h1>
    </div>

    <header class="topbar">
      <div class="stats">
        <span id="popCount">0</span> хлопков
      </div>
      <button id="musicToggle" class="music-toggle">🎵 Музыка</button>
      <button id="resetBtn" class="reset-btn" title="Вернуть все пупырки">
        <span class="reset-icon">↺</span> Вернуть пупырки
      </button>
    </header>

    <button id="settingsToggle" class="settings-toggle">
      <span>⚙️ Настройки Pop It</span>
      <span class="chevron">▾</span>
    </button>

    <section class="controls collapsed" id="controls">
      <div class="control-group">
        <span class="control-label">Форма пупырок</span>
        <div class="option-row" id="shapeRow"></div>
      </div>
      <div class="control-group">
        <span class="control-label">Форма рамки</span>
        <div class="option-row" id="frameRow"></div>
      </div>
      <div class="control-group">
        <span class="control-label">Размер</span>
        <div class="option-row" id="sizeRow"></div>
      </div>
      <div class="control-group">
        <span class="control-label">Цвет</span>
        <div class="option-row" id="paletteRow"></div>
      </div>
      <div class="control-group" id="paintGroup">
        <span class="control-label">Своя раскраска</span>
        <div class="option-row" id="paintRow"></div>
        <button id="paintToggle" class="paint-toggle">Кисть выкл.</button>
      </div>
    </section>

    <main id="board" class="board"></main>

    <footer class="hint">Лопай пупырки пальцем или мышкой ✨</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
